services:
  smart-home-ai:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/smart-home.db
      PORT: 5000
      ESP32_TRANSPORT: ${DOCKER_ESP32_TRANSPORT:-websocket}
    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:5000:5000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
